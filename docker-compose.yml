services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    ports:
      - 8000:8000
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
    depends_on:
      tts:
        condition: service_healthy
      ollama:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    develop:
      watch:
        - path: ./app
          action: restart
          target: /app/app
    command: ["/app/.venv/bin/arq", "app.workers.setup.WorkerSettings"]

  comfy:
    extends:
      file: comfy-compose.yaml
      service: comfy
  ollama:
    image: ollama/ollama:latest
    ports:
      - "8001:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5m
      timeout: 3s
      start_period: 2m
      start_interval: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.tts
    ports:
      - "8002:8020"
    volumes:
      - ./resources/xtts_cache:/root/.local/share/tts
      - ./resources/xtts_audio:/app/output_audio
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8020/healthcheck')",
        ]
      interval: 5m
      timeout: 3s
      retries: 2
      start_period: 4m
      start_interval: 45s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:latest
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    ports:
      - 8004:6379
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
