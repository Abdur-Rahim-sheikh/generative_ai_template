services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    ports:
      - 8000:8000
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
        - path: ./pyproject.toml
          action: rebuild
          target: /app/pyproject.toml
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    develop:
      watch:
        - path: ./app
          action: restart
          target: /app/app
    restart: on-failure:3

    command:
      ["/app/.venv/bin/arq", "app.entrypoints.workers.setup.WorkerSettings"]

  redis:
    image: redis:latest
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    ports:
      - 8004:6379
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASSWORD
      - POSTGRES_DB=$DB_NAME

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - 8005:80
    depends_on:
      - db
