services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    ports:
      - 8000:8000
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
    restart: on-failure:3

  worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    develop:
      watch:
        - path: ./app
          action: restart
          target: /app/app
    restart: on-failure:3

    command: ["/app/.venv/bin/arq", "app.workers.setup.WorkerSettings"]

  redis:
    image: redis:latest
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    ports:
      - 8004:6379
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
