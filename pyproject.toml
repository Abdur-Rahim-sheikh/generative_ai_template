[project]
name = "generative-ai-template"
version = "0.1.1"
description = "This template serves the servies of opensource generative ai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.131.0",
    "ffmpeg>=1.4",
    "filetype>=1.2.0",
    "num2words>=0.5.14",
    "ollama>=0.6.1",
    "pillow>=12.1.0",
    "pydantic-settings>=2.12.0",
    "redis[hiredis]>=7.1.0",
    "sqlmodel>=0.0.37",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
test = [
    "polyfactory>=3.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
